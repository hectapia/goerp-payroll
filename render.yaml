# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# =============================================================================
# GoERP Payroll - Render Single Web Service Deployment
# =============================================================================
#
# Minimal single-service deployment for testing GoERP Payroll on Render:
# - Connects directly to external Neon PostgreSQL (Ohio us-east-2)
# - Runs in web-only mode with synchronous calculations (QUEUE_ENABLED=0)
# - No Redis or background worker required
# - Eligible for Render's Free or Starter tier
#
# =============================================================================

version: "1"

services:
  - type: web
    name: goerp-payroll
    runtime: docker
    region: ohio
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PROCESS_ROLE
        value: web
      - key: QUEUE_ENABLED
        value: "0"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: NeonAdminPassword2026!
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_CVIwn4k6ulmv@ep-damp-bread-b4fq1gik-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: SECRET_KEY
        generateValue: true
