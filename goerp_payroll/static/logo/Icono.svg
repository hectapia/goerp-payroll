<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for GoERP brand colors -->
    <linearGradient id="goCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="erpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Angled Monogram G -->
  <g transform="translate(45, 140)">
    <!-- Letter G in dynamic angled polygon style -->
    <path d="M 125 180 
             C 75 180, 35 145, 35 95 
             C 35 45, 75 10, 125 10 
             C 155 10, 180 25, 195 45 
             L 160 70 
             C 150 55, 140 45, 125 45 
             C 95 45, 75 68, 75 95 
             C 75 122, 95 145, 125 145 
             C 142 145, 155 138, 163 125 
             L 125 125 
             L 125 95 
             L 198 95 
             C 200 135, 175 180, 125 180 Z" 
          fill="url(#goCyan)" />

    <!-- Angled Ring O overlapping G diagonally -->
    <g transform="translate(140, -65)">
      <circle cx="95" cy="95" r="85" fill="none" stroke="url(#goDarkBlue)" stroke-width="40" />
      <!-- Faceted highlight -->
      <path d="M 40 40 A 85 85 0 0 1 150 40 L 130 65 A 50 50 0 0 0 65 65 Z" fill="#38bdf8" opacity="0.6" />
    </g>
  </g>

  <!-- ERP in bold forest green -->
  <g transform="translate(230, 260)">
    <text x="0" y="70" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="95" fill="url(#erpGreen)" letter-spacing="3">ERP</text>
  </g>

  <!-- Payroll subtitle + checkmark -->
  <g transform="translate(232, 370)">
    <!-- Checkmark accent -->
    <path d="M -30 -15 L -18 0 L 8 -30 L 14 -22 L -18 12 L -36 -7 Z" fill="url(#checkGrad)" />
    <!-- Payroll text -->
    <text x="3" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#1e293b" letter-spacing="2">Payroll</text>
  </g>
</svg>